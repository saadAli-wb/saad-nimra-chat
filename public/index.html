<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f1a">
<title>Saad &amp; Nimra</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<script>
  const nav = performance.getEntriesByType('navigation')[0];

  if (nav && nav.type === 'reload') {
    sessionStorage.removeItem('accessGranted');
    window.location.replace('/access.html');
  } else if (sessionStorage.getItem('accessGranted') !== 'yes') {
    window.location.replace('/access.html');
  } else {
    sessionStorage.removeItem('accessGranted');
  }
</script>

<section id="auth">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Choose your account to continue</p>

    <div class="tiles">
      <button class="tile" data-user="saad" type="button">
        <img alt="">
        <span>Saad</span>
      </button>

      <button class="tile" data-user="nimra" type="button">
        <img alt="">
        <span>Nimra</span>
      </button>
    </div>

    <form id="authForm" hidden>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="cta">Sign in</button>
      <p id="authErr" class="err"></p>
    </form>
  </div>
</section>

<div id="app" hidden>

  <header>
    <img id="hdrAv" class="av" alt="">
    <div class="who">
      <b id="hdrName"></b>
      <small id="hdrSub"></small>
    </div>

    <button class="ibtn" id="bVoice" title="Voice call">
      <i data-ic="phone"></i>
    </button>

    <button class="ibtn" id="bVideo" title="Video call">
      <i data-ic="video"></i>
    </button>

    <button class="ibtn" id="bMenu" title="Menu">
      <i data-ic="dots"></i>
    </button>
  </header>

  <main id="stream"></main>

  <div id="emoji" hidden></div>

  <footer>
    <button class="ibtn" id="bEmoji" title="Emoji">
      <i data-ic="smile"></i>
    </button>

    <button class="ibtn" id="bAttach" title="Attach photo or video">
      <i data-ic="clip"></i>
    </button>

    <input id="msgInput" placeholder="Type a message" autocomplete="off">

    <button class="ibtn fab" id="bMic" title="Record voice message">
      <i data-ic="mic"></i>
    </button>

    <button class="ibtn fab" id="bSend" title="Send" hidden>
      <i data-ic="send"></i>
    </button>

    <div id="recBar" hidden>
      <button class="ibtn" id="recCancel" title="Discard">
        <i data-ic="x"></i>
      </button>

      <span class="recdot"></span>
      <b id="recTime">0:00</b>
      <span class="muted grow">Recording…</span>

      <button class="ibtn fab" id="recSend" title="Send voice message">
        <i data-ic="send"></i>
      </button>
    </div>
  </footer>

</div>

<input type="file" id="fileMedia" accept="image/*,video/*" multiple hidden>
<input type="file" id="fileAvatar" accept="image/*" hidden>
<input type="file" id="fileWall" accept="image/*" hidden>
<input type="file" id="fileStatus" accept="image/*" hidden>

<div id="sheet" class="overlay" hidden>
  <div class="panel">

    <div class="panel-h">
      <h3>Settings</h3>
      <button class="ibtn" data-close="sheet">
        <i data-ic="x"></i>
      </button>
    </div>

    <div class="me-row">
      <img id="sheetAv" class="av lg" alt="">
      <div>
        <b id="sheetMe"></b>
        <div class="muted">Signed in</div>
      </div>
    </div>

    <button class="item" id="avPick">Change my profile picture</button>

    <div class="item">
      <input id="nameInput" maxlength="40" placeholder="Contact name">
      <button id="nameSave" class="mini">Save</button>
    </div>

    <div class="item">
      <span>Chat wallpaper</span>
      <span>
        <button class="mini" id="wallPick">Choose</button>
        <button class="mini" id="wallReset">Default</button>
      </span>
    </div>

    <button class="item" id="openStatus">Status</button>

    <button class="item" id="notifBtn"></button>

    <button class="item danger" id="logoutBtn">Logout</button>

  </div>
</div>

<div id="statusModal" class="overlay" hidden>
  <div class="panel">

    <div class="panel-h">
      <h3>Status</h3>
      <button class="ibtn" data-close="statusModal">
        <i data-ic="x"></i>
      </button>
    </div>

    <div class="seg">
      <button id="tabPeer"></button>
      <button id="tabMe">My status</button>
    </div>

    <div id="stCompose">

      <textarea id="stText" maxlength="300" placeholder="Write a status…"></textarea>

      <div class="item">
        <button class="mini" id="stPhoto">Add photo status</button>
        <button class="mini cta" id="stPost">Post text</button>
      </div>

    </div>

    <div id="stList"></div>

  </div>
</div>

<div id="lightbox" class="overlay dark" hidden>
  <img id="lbImg" alt="">
</div>

<div id="callScreen" hidden>

  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay playsinline muted></video>

  <div class="cinfo">

    <img id="cAv" class="av xl" alt="">

    <h2 id="cName"></h2>
    <p id="cTitle"></p>
    <small id="cSub"></small>
    <small id="cSelf" class="muted"></small>

  </div>

  <div class="cctl">

    <button class="cbtn" id="cMute">
      <i data-ic="mic"></i>
      <small>Mute</small>
    </button>

    <button class="cbtn" id="cCam">
      <i data-ic="video"></i>
      <small>Camera off</small>
    </button>

    <button class="cbtn red hang" id="cEnd">
      <i data-ic="phone"></i>
      <small>End</small>
    </button>

    <button class="cbtn green" id="cAccept">
      <i data-ic="phone"></i>
      <small>Accept</small>
    </button>

  </div>

</div>

<div id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
